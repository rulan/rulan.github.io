<nav class="pagination {% unless paginator.previous_page or paginator.next_page %}is-empty{% endunless %}">
    <div class="pagination-inner">

        {% if paginator.previous_page %}
        <a class="newer" href="{{ paginator.previous_page_path | relative_url }}">
            ← Newer entries
        </a>
        {% endif %}

        {% if paginator.next_page %}
        <a class="older" href="{{ paginator.next_page_path | relative_url }}">
            Older entries →
        </a>
        {% endif %}

    </div>
</nav>
